
<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">

    <title>Subjects | StudentHub</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/app.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/subjects.js" defer></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" data-sidebar></aside>

        <div class="main-area">
            <header class="topbar">
                <button
                    class="icon-button mobile-menu"
                    data-mobile-menu
                    aria-label="Open navigation"
                >
                    ☰
                </button>

                <span class="topbar-title">
                    Your academic space
                </span>

                <div class="topbar-actions">
                    <button
                        class="theme-toggle"
                        data-theme-toggle
                        type="button"
                        aria-label="Switch theme"
                    ></button>

                    <a class="btn btn-quiet" href="notifications.html">
                        Notifications
                    </a>

                    <a
                        class="avatar"
                        href="profile.html"
                        aria-label="My profile"
                    >
                        N
                    </a>
                </div>
            </header>

            <main class="page-content">
                <div class="page-heading">
                    <div>
                        <span class="eyebrow">ACADEMIC</span>

                        <h1>Subjects</h1>

                        <p>
                            See your course progress, attendance and
                            learning resources.
                        </p>
                    </div>
                    <button class="btn btn-primary" id="add-subject" type="button" aria-expanded="false">
                        + Add subject
                    </button>
                </div>

                <p class="notice" id="subjects-sample-note" role="note">
                    Starter subjects are examples, not your actual enrollment. Remove them and add your own course details.
                </p>

                <section class="card" id="subject-editor" hidden>
                    <form id="subject-form" class="form-grid">
                        <div class="form-field">
                            <label for="subject-name">Subject name</label>
                            <input class="field" id="subject-name" name="name" maxlength="80" required>
                        </div>
                        <div class="form-field">
                            <label for="subject-instructor">Instructor (optional)</label>
                            <input class="field" id="subject-instructor" name="instructor" maxlength="80">
                        </div>
                        <div class="form-field">
                            <label for="subject-credits">Credits (optional)</label>
                            <input class="field" id="subject-credits" name="credits" type="number" min="0" max="30">
                        </div>
                        <div class="form-field">
                            <label for="subject-progress">Course progress (%)</label>
                            <input class="field" id="subject-progress" name="progress" type="number" min="0" max="100" value="0" required>
                        </div>
                        <div class="form-field">
                            <label for="subject-type">Type</label>
                            <select class="select" id="subject-type" name="type">
                                <option value="core">Core</option>
                                <option value="elective">Elective</option>
                            </select>
                        </div>
                        <div class="form-field full">
                            <div class="toolbar">
                                <button class="btn btn-primary" type="submit">Save subject</button>
                                <button class="btn btn-secondary" id="cancel-subject" type="button">Cancel</button>
                            </div>
                        </div>
                    </form>
                </section>

                <div class="toolbar">
                    <input
                        class="field"
                        id="subject-search"
                        type="search"
                        aria-label="Search subjects"
                        placeholder="Search subjects..."
                    >

                    <select
                        class="select"
                        id="subject-filter"
                    >
                        <option value="all">All subjects</option>
                        <option value="core">Core</option>
                        <option value="elective">Elective</option>
                    </select>
                </div>

                <div
                    class="content-grid"
                    id="subject-grid"
                ></div>

                <p class="footer-note">
                    StudentHub · Your academic space ·
                    <span data-year></span>
                    · Subjects are saved in this browser.
                </p>
            </main>
        </div>
    </div>
</body>

</html>
