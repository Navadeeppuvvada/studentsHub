
<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">

    <title>Community | StudentHub</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/app.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/community.js" defer></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" data-sidebar></aside>

        <div class="main-area">
            <header class="topbar">
                <button
                    class="icon-button mobile-menu"
                    data-mobile-menu
                    aria-label="Open navigation"
                >
                    ☰
                </button>

                <span class="topbar-title">
                    Your academic space
                </span>

                <div class="topbar-actions">
                    <button
                        class="theme-toggle"
                        data-theme-toggle
                        type="button"
                        aria-label="Switch theme"
                    ></button>

                    <a class="btn btn-quiet" href="notifications.html">
                        Notifications
                    </a>

                    <a
                        class="avatar"
                        href="profile.html"
                        aria-label="My profile"
                    >
                        N
                    </a>
                </div>
            </header>

            <main class="page-content">
                <div class="page-heading">
                    <div>
                        <span class="eyebrow">STUDENT COMMUNITY</span>

                        <h1>Community</h1>

                        <p>
                            A friendly space for study discussions and peer support.
                        </p>
                    </div>
                </div>

                <section class="card">
                    <form id="community-post-form">
                        <div class="form-field">
                            <label for="post-text">Share a question or idea</label>
                            <textarea class="textarea" id="post-text" name="body"
                                      rows="3" maxlength="1000" required
                                      placeholder="What are you working on today?"></textarea>
                        </div>
                        <button class="btn btn-primary" id="publish-post" type="submit"
                                style="margin-top:12px">Publish post</button>
                    </form>
                </section>

                <div
                    id="post-list"
                    style="margin-top:18px;display:grid;gap:14px"
                ></div>

                <p class="footer-note">
                    StudentHub · Your academic space ·
                    <span data-year></span>
                    · Posts and replies are only stored in this browser.
                </p>
            </main>
        </div>
    </div>
</body>

</html>
