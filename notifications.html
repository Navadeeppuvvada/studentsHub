
<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">

    <title>Notifications | StudentHub</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/app.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/notifications.js" defer></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" data-sidebar></aside>

        <div class="main-area">
            <header class="topbar">
                <button
                    class="icon-button mobile-menu"
                    data-mobile-menu
                    aria-label="Open navigation"
                >
                    ☰
                </button>

                <span class="topbar-title">
                    Your academic space
                </span>

                <div class="topbar-actions">
                    <button
                        class="theme-toggle"
                        data-theme-toggle
                        type="button"
                        aria-label="Switch theme"
                    ></button>

                    <a class="btn btn-quiet" href="notifications.html">
                        Notifications
                    </a>

                    <a
                        class="avatar"
                        href="profile.html"
                        aria-label="My profile"
                    >
                        N
                    </a>
                </div>
            </header>

            <main class="page-content">
                <div class="page-heading">
                    <div>
                        <span class="eyebrow">PERSONAL</span>

                        <h1>Notifications</h1>

                        <p>
                            Important updates, reminders and activity in one place.
                        </p>
                    </div>

                    <button class="btn btn-secondary" id="mark-all-read">
                        Mark all read
                    </button>
                </div>

                <div class="toolbar">
                    <select class="select" id="notification-filter">
                        <option value="all">All notifications</option>
                        <option value="unread">Unread only</option>
                    </select>
                </div>

                <div class="card">
                    <div class="stack" id="notification-list"></div>
                </div>

                <p class="footer-note">
                    StudentHub · Your academic space ·
                    <span data-year></span>
                    · Demo data is stored in this browser only.
                </p>
            </main>
        </div>
    </div>
</body>

</html>
