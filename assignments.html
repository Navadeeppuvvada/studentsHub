
<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">

    <title>Assignments | StudentHub</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/app.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/assignments.js" defer></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" data-sidebar></aside>

        <div class="main-area">
            <header class="topbar">
                <button
                    class="icon-button mobile-menu"
                    data-mobile-menu
                    aria-label="Open navigation"
                >
                    ☰
                </button>

                <span class="topbar-title">
                    Your academic space
                </span>

                <div class="topbar-actions">
                    <button
                        class="theme-toggle"
                        data-theme-toggle
                        type="button"
                        aria-label="Switch theme"
                    ></button>

                    <a class="btn btn-quiet" href="notifications.html">
                        Notifications
                    </a>

                    <a
                        class="avatar"
                        href="profile.html"
                        aria-label="My profile"
                    >
                        N
                    </a>
                </div>
            </header>

            <main class="page-content">
                <div class="page-heading">
                    <div>
                        <span class="eyebrow">ACADEMIC</span>

                        <h1>Assignments</h1>

                        <p>
                            Break down your work and stay ahead of deadlines.
                        </p>
                    </div>

                    <button class="btn btn-primary" id="add-assignment">
                        + Add assignment
                    </button>
                </div>

                <div class="stats-grid">
                    <article class="stat-card">
                        <div class="stat-top">Total tasks</div>
                        <div class="stat-value" id="total-count">04</div>
                    </article>

                    <article class="stat-card">
                        <div class="stat-top">Pending</div>
                        <div class="stat-value" id="pending-count">03</div>
                    </article>

                    <article class="stat-card">
                        <div class="stat-top">Completed</div>
                        <div class="stat-value" id="completed-count">01</div>
                    </article>

                    <article class="stat-card">
                        <div class="stat-top">Next deadline</div>
                        <div class="stat-value" style="font-size:21px">
                            20 Oct
                        </div>
                    </article>
                </div>

                <div class="toolbar">
                    <input
                        class="field"
                        id="assignment-search"
                        placeholder="Search assignments..."
                    >

                    <select class="select" id="assignment-filter">
                        <option value="all">All statuses</option>
                        <option value="pending">Pending</option>
                        <option value="done">Completed</option>
                    </select>
                </div>

                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Assignment</th>
                                <th>Subject</th>
                                <th>Due date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="assignment-rows"></tbody>
                    </table>
                </div>

                <p class="footer-note">
                    StudentHub · Your academic space ·
                    <span data-year></span>
                    · Demo data is stored in this browser only.
                </p>
            </main>
        </div>
    </div>
</body>

</html>
